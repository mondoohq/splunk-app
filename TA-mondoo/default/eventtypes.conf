# ---------------------------------------------------------------------------
# Mondoo eventtypes — one per sourcetype. Used for CIM tagging in tags.conf.
# ---------------------------------------------------------------------------

[mondoo_audit]
search = sourcetype="mondoo:rest:audit"

[mondoo_advisory]
search = sourcetype="mondoo:rest:advisory"

[mondoo_agent]
search = sourcetype="mondoo:rest:agent"

[mondoo_asset]
search = (sourcetype="mondoo:json:asset" OR sourcetype="mondoo:rest:asset")

[mondoo_vulnerability]
search = sourcetype="mondoo:json:vuln"

[mondoo_check]
search = (sourcetype="mondoo:json:check" OR sourcetype="mondoo:rest:check")

[mondoo_control]
search = sourcetype="mondoo:json:control"

[mondoo_package]
search = sourcetype="mondoo:json:package"

[mondoo_query]
search = sourcetype="mondoo:json:query"

# Legacy alias — kept so existing saved searches/dashboards don't break.
[mondoo_vulnerabilities]
search = sourcetype="mondoo:json:vuln"
