# Mondoo modular input default configuration
# Each stanza creates one input collecting the configured log types.
#
# mondoo_config_blob  : JSON credential blob downloaded from the Mondoo console
#                       (contains api_endpoint, space_mrn / mrn, and either
#                        "token" or a certificate+private_key pair).
#                       You may also paste a raw JWT token string here.
#
# log_types           : Comma-separated list of log types to collect.
#                       Supported: audit, advisories
#                       Example:   audit,advisories
#
# resource_mrn        : Override the space/org MRN extracted from the blob.
#                       Format: //captain.api.mondoo.app/spaces/<space-id>
#                       Leave empty to auto-detect from the config blob.
#
# index               : Target Splunk index.
#
# interval            : Polling interval in seconds (default: 300).
#
# page_size           : Number of log entries to fetch per API call (default: 100).
#
# initial_lookback_days: On the very first run, how many days back to retrieve.
#                        Set to 0 to fetch all available history (default: 7).

# NOTE: stanza prefix must match the script filename (mondoo_input.py)
#
# Python interpreter selection — both fields are set on purpose:
#   * python.required (introduced in Splunk 9.0; preferred from 10.2 onward)
#   * python.version (legacy; still required by current AppInspect cloud
#     checks even though Splunk 10.2 marks it deprecated)
# Setting both in the scheme stanza AND in the instance stanza prevents the
# interpreter selection from drifting between them.
[mondoo_input]
python.required = 3.13
python.version  = python3

[mondoo_input://default]
python.required = 3.13
python.version  = python3
interval    = 300
index       = mondoo
log_types   = audit
page_size   = 100
initial_lookback_days = 7
disabled    = 1
# mondoo_config_blob = <paste your JSON blob or raw JWT token here>
# resource_mrn       = //captain.api.mondoo.app/spaces/<space-id>


# ETL Runner input
[monitor:///opt/mondoo-etl/export/*.jsonl]
disabled = 1
index = mondoo
sourcetype = mondoo:json
crcSalt = <SOURCE>
