# ---------------------------------------------------------------------------
# TA-mondoo health & telemetry searches.  All disabled by default so an
# install never silently starts running scheduled work — enable the ones
# you care about per-instance.
# ---------------------------------------------------------------------------

[Mondoo - Ingestion lag (no events in 24h)]
description = Alerts when no events from any Mondoo sourcetype have been indexed in the last 24 hours.
search = | tstats latest(_time) AS last_event WHERE index=mondoo sourcetype="mondoo:*" \
    | eval lag_hours = round((now() - last_event) / 3600, 1) \
    | where lag_hours > 24
disabled = 1
is_scheduled = 0
cron_schedule = 0 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert.suppress = 1
alert.suppress.period = 6h
alert.severity = 4
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

[Mondoo - Modular input errors (last 1h)]
description = Lists ERROR-level log lines emitted by the Mondoo modular input in the past hour.
# ExecProcessor logs everything a modular input writes to stderr at ERROR
# level, including the input's own INFO lines. Match the logger's own level
# marker ("ERROR mondoo_input: ...") instead of the bare word ERROR, or this
# fires on healthy operation.
search = index=_internal source=*splunkd.log component=ExecProcessor ("ERROR mondoo_input" OR "ERROR mondoo_api") \
    | rex "ERROR\s+(?<logger>\S+):\s+(?<reason>.+)" \
    | stats count, latest(_time) AS last_seen BY reason
disabled = 1
is_scheduled = 0
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
alert.suppress = 1
alert.suppress.period = 1h
alert.severity = 3
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

[Mondoo - Daily ingestion volume by sourcetype]
description = Volume report — events per sourcetype per day. Useful for license sizing.
search = | tstats count WHERE index=mondoo sourcetype="mondoo:*" BY sourcetype, _time span=1d \
    | sort 0 _time, sourcetype
disabled = 1
is_scheduled = 0
cron_schedule = 0 1 * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = @d
