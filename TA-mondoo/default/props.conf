# ---------------------------------------------------------------------------
# Internal TA logs (only used if the operator monitors them explicitly).
# ---------------------------------------------------------------------------
[source::...ta-mondoo*.log*]
SHOULD_LINEMERGE = true
sourcetype = tamondoo:log

[source::...ta_mondoo*.log*]
SHOULD_LINEMERGE = true
sourcetype = tamondoo:log

# ---------------------------------------------------------------------------
# File-monitor router — *.jsonl ETL exports → sourcetype based on filename
# ---------------------------------------------------------------------------
[mondoo:json]
DATETIME_CONFIG = CURRENT
category = Structured
TRANSFORMS-sourcetype = mondoo_asset,mondoo_check,mondoo_control,mondoo_package,mondoo_query,mondoo_vuln
TRUNCATE = 999999

# ===========================================================================
# Mondoo – Audit Logs  (CIM: Change)
# ===========================================================================
[mondoo:rest:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
NO_BINARY_CHECK  = true
CHARSET          = UTF-8
KV_MODE          = json
TRUNCATE         = 999999
TIME_PREFIX      = "timestamp"\s*:\s*"
TIME_FORMAT      = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 64

FIELDALIAS-cim_user           = identity_name AS user
FIELDALIAS-cim_object         = resource      AS object
FIELDALIAS-cim_result_message = msg           AS result_message
FIELDALIAS-vendor_action      = action        AS vendor_action

# Map raw Mondoo gRPC action (mondoo.captain.Captain.CreateSpace) → CIM verb
# (created/updated/deleted/read/...).  The lookup populates change_type only
# when there's a match; raw value remains in `vendor_action`.
LOOKUP-cim_change_type        = mondoo_action_lookup mondoo_action AS action OUTPUTNEW action AS change_type

EVAL-vendor   = "Mondoo"
EVAL-product  = "Mondoo Platform"
EVAL-log_type = "audit"
EVAL-dvc      = "mondoo"
EVAL-result   = "success"


# ===========================================================================
# Mondoo – Assets / Devices  (CIM: Inventory / Endpoint)
# ===========================================================================
[mondoo:json:asset]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
NO_BINARY_CHECK  = true
CHARSET          = UTF-8
KV_MODE          = json
TRUNCATE         = 999999
TIME_PREFIX      = "updatedAt"\s*:\s*"
TIME_FORMAT      = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 64

FIELDALIAS-cim_dest        = name             AS dest
FIELDALIAS-cim_os          = platform_name    AS os
FIELDALIAS-cim_version     = platform_version AS version
FIELDALIAS-cim_endpoint_id = asset_id         AS endpoint_id

EVAL-vendor   = "Mondoo"
EVAL-product  = "Mondoo Platform"
EVAL-log_type = "asset_inventory"
EVAL-dvc      = "mondoo"
EVAL-url      = "https://console.mondoo.com/space/inventory/"+asset_id+"/overview?spaceId="+space_id


