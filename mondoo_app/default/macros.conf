# ---------------------------------------------------------------------------
# Shared search macros.  Dashboards and saved searches reference these so the
# operator can point the app at a custom index by editing one place.
# ---------------------------------------------------------------------------

[mondoo_index]
definition = index=mondoo
iseval = 0

# Sourcetype shortcuts ------------------------------------------------------

[mondoo_assets]
definition = `mondoo_index` (sourcetype="mondoo:json:asset" OR sourcetype="mondoo:rest:asset")
iseval = 0

[mondoo_vulns]
definition = `mondoo_index` sourcetype="mondoo:json:vuln"
iseval = 0

[mondoo_advisories]
definition = `mondoo_index` sourcetype="mondoo:rest:advisory"
iseval = 0

[mondoo_checks]
definition = `mondoo_index` (sourcetype="mondoo:json:check" OR sourcetype="mondoo:rest:check")
iseval = 0

[mondoo_audit]
definition = `mondoo_index` sourcetype="mondoo:rest:audit"
iseval = 0

[mondoo_agents]
definition = `mondoo_index` sourcetype="mondoo:rest:agent"
iseval = 0

# Severity buckets ----------------------------------------------------------
# Use as inline filters:  `mondoo_vulns` `mondoo_severity_critical`

[mondoo_severity_critical]
definition = (severity="critical" OR rating="CRITICAL" OR cvss>=9.0)
iseval = 0

[mondoo_severity_high_or_above]
definition = (severity IN ("critical","high") OR rating IN ("CRITICAL","HIGH") OR cvss>=7.0)
iseval = 0

[mondoo_severity_medium_or_above]
definition = (severity IN ("critical","high","medium") OR rating IN ("CRITICAL","HIGH","MEDIUM") OR cvss>=4.0)
iseval = 0

# Asset freshness -----------------------------------------------------------
# Sub-search that returns asset_id values seen in the last 7 days.

[mondoo_active_assets]
definition = [search `mondoo_assets` earliest=-7d@d latest=now | stats count by asset_id | fields asset_id]
iseval = 0
