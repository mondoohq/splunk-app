# ---------------------------------------------------------------------------
# Reports and alerts shipped with the Mondoo dashboard app.  All are disabled
# by default; enable per-instance via Splunk Web → Searches, reports & alerts.
# ---------------------------------------------------------------------------

[Mondoo - Critical open vulnerabilities by asset]
description = Top assets by count of critical-severity vulnerabilities currently open.
search = `mondoo_vulns` `mondoo_severity_critical` state="open" \
    | stats dc(vuln_id) AS critical_vulns BY asset_name \
    | sort 0 -critical_vulns
disabled = 1
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Mondoo - Stale assets (not seen in 7d)]
description = Assets whose latest update is older than 7 days. Likely offline or decommissioned.
search = `mondoo_assets` \
    | stats max(_time) AS last_seen BY asset_name \
    | eval days_since_seen = round((now() - last_seen) / 86400, 1) \
    | where days_since_seen >= 7 \
    | sort 0 -days_since_seen
disabled = 1
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Mondoo - Failed checks by severity]
description = Summary of currently-failing policy checks bucketed by severity.
search = `mondoo_checks` status="fail" \
    | stats dc(query_mrn) AS check_count BY rating \
    | sort 0 -check_count
disabled = 1
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Mondoo - Audit activity in last 24h]
description = Recent audit-log activity, grouped by user and action.
search = `mondoo_audit` \
    | stats count BY user, vendor_action, change_type \
    | sort 0 -count
disabled = 1
dispatch.earliest_time = -24h
dispatch.latest_time = now

# Alert: new critical CVE in last hour ---------------------------------------

[Mondoo - New critical CVE finding]
description = Alert when a new critical-severity CVE finding appears.
search = `mondoo_vulns` `mondoo_severity_critical` state="open" \
    | stats min(_time) AS first_seen BY vuln_id, asset_name \
    | where first_seen > relative_time(now(), "-1h@h")
disabled = 1
is_scheduled = 0
cron_schedule = */15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
alert.suppress = 1
alert.suppress.period = 1h
alert.severity = 5
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
